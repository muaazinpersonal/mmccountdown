<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#061f2d" />
    <meta
      name="description"
      content="A presentation-ready MMC countdown timer with three gentle reminder variations."
    />
    <title>MMC Countdown</title>
    <style>
:root {
  color-scheme: dark;
  --ink: #f7fbfc;
  --muted: #9eb5bc;
  --ocean-950: #03151f;
  --ocean-900: #06222f;
  --ocean-800: #0b3341;
  --teal: #1fb7ad;
  --teal-bright: #4bd6c8;
  --orange: #f58a3a;
  --orange-bright: #ffad66;
  --line: rgba(255, 255, 255, 0.13);
  --panel: rgba(4, 24, 33, 0.68);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: var(--ocean-950);
}

body {
  min-width: 320px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  overflow-x: hidden;
  color: var(--ink);
  background:
    radial-gradient(circle at 50% 35%, rgba(23, 132, 139, 0.16), transparent 34rem),
    linear-gradient(145deg, #041922 0%, #082b37 52%, #051c28 100%);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
a:focus-visible {
  outline: 3px solid rgba(75, 214, 200, 0.75);
  outline-offset: 3px;
}

[hidden] {
  display: none !important;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.ambient {
  position: fixed;
  z-index: 0;
  pointer-events: none;
  filter: blur(2px);
}

.ambient--orange {
  top: -12rem;
  right: -16rem;
  width: 42rem;
  height: 30rem;
  border-radius: 46% 54% 62% 38%;
  background: radial-gradient(circle at 50% 55%, rgba(245, 138, 58, 0.38), rgba(245, 138, 58, 0.06) 55%, transparent 72%);
  transform: rotate(-12deg);
}

.ambient--teal {
  bottom: -18rem;
  left: -12rem;
  width: 48rem;
  height: 34rem;
  border-radius: 55% 45% 42% 58%;
  background: radial-gradient(circle at 54% 45%, rgba(31, 183, 173, 0.3), rgba(31, 183, 173, 0.04) 59%, transparent 72%);
  transform: rotate(10deg);
}

.app-shell {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding: max(1rem, env(safe-area-inset-top)) clamp(1rem, 3vw, 3.25rem) max(1rem, env(safe-area-inset-bottom));
}

.topbar {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  width: 100%;
  min-height: 5.4rem;
}

.brand {
  position: absolute;
  top: 0.45rem;
  left: 50%;
  display: inline-flex;
  color: inherit;
  text-decoration: none;
  transform: translateX(-50%);
}

.brand__plate {
  position: relative;
  display: grid;
  place-items: center;
  min-width: 15rem;
  min-height: 5.2rem;
}

.brand__logo {
  position: relative;
  z-index: 2;
  display: block;
  width: min(42.5vw, 16.875rem);
  height: auto;
  max-height: 5rem;
  object-fit: contain;
  filter: drop-shadow(0 0.65rem 1.4rem rgba(0, 0, 0, 0.24));
}

.sound-control {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  min-height: 2.9rem;
  padding: 0.65rem 0.9rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.06);
  cursor: pointer;
  backdrop-filter: blur(12px);
  transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
}

.sound-control:hover {
  border-color: rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.1);
  transform: translateY(-1px);
}

.sound-control[aria-pressed="false"] .sound-wave {
  opacity: 0.25;
}

.icon {
  width: 1.25rem;
  height: 1.25rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.play-icon,
.pause-icon {
  fill: currentColor;
  stroke: none;
}

.timer-workspace {
  display: grid;
  place-items: center;
  width: 100%;
  padding: clamp(2rem, 6vh, 5rem) 0;
}

.timer-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: min(100%, 76rem);
}

.status-line {
  display: inline-flex;
  align-items: center;
  gap: 0.65rem;
  min-height: 2.25rem;
  padding: 0.45rem 0.8rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: #c5d6da;
  background: rgba(1, 13, 19, 0.28);
  font-size: 0.78rem;
  font-weight: 760;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.status-dot {
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 50%;
  background: #89a2a8;
  box-shadow: 0 0 0 0.28rem rgba(137, 162, 168, 0.12);
  transition: background 220ms ease, box-shadow 220ms ease;
}

body.is-running .status-dot {
  background: var(--teal-bright);
  box-shadow: 0 0 0 0.3rem rgba(75, 214, 200, 0.14), 0 0 1.25rem rgba(75, 214, 200, 0.5);
  animation: breathe 2s ease-in-out infinite;
}

body.is-warning .status-dot,
body.is-final-minute .status-dot,
body.is-finished .status-dot {
  background: var(--orange-bright);
  box-shadow: 0 0 0 0.3rem rgba(255, 173, 102, 0.14), 0 0 1.4rem rgba(255, 173, 102, 0.58);
}

.timer-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  width: 100%;
  margin: clamp(1.5rem, 4vh, 3.2rem) 0 clamp(1.25rem, 3vh, 2.4rem);
}

.timer-wrap::before {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: -1;
  width: min(82vw, 50rem);
  height: min(29vw, 15rem);
  content: "";
  border-radius: 50%;
  background: rgba(35, 190, 182, 0.11);
  filter: blur(3.6rem);
  transform: translate(-50%, -50%);
  transition: background 350ms ease;
}

body.is-warning .timer-wrap::before,
body.is-final-minute .timer-wrap::before,
body.is-finished .timer-wrap::before {
  background: rgba(245, 138, 58, 0.18);
}

.timer-display {
  display: flex;
  align-items: baseline;
  justify-content: center;
  color: #fff;
  font-size: clamp(7.65rem, 24vw, 22.5rem);
  font-variant-numeric: tabular-nums;
  font-weight: 720;
  letter-spacing: -0.075em;
  line-height: 0.84;
  text-align: center;
  text-shadow: 0 0.14rem 0 rgba(255, 255, 255, 0.14), 0 1.5rem 3.5rem rgba(0, 0, 0, 0.3);
  transition: color 260ms ease, transform 260ms var(--ease);
}

.timer-display.has-hours {
  font-size: clamp(5.8rem, 15.5vw, 15.5rem);
}

.timer-display > span,
#hoursGroup {
  display: inline-flex;
  align-items: baseline;
}

.separator {
  margin: 0 0.08em;
  color: rgba(255, 255, 255, 0.32);
  font-weight: 400;
}

body.is-warning .timer-display,
body.is-finished .timer-display {
  color: var(--orange-bright);
}

body.is-final-minute .timer-display {
  color: #ff5454;
  text-shadow: 0 0.14rem 0 rgba(255, 255, 255, 0.12), 0 0 2.4rem rgba(255, 44, 44, 0.36), 0 1.5rem 3.5rem rgba(0, 0, 0, 0.3);
  animation: final-minute-blink 1.2s ease-in-out infinite;
}

body.is-finished .timer-display {
  animation: finish-pulse 1.4s ease-in-out 3;
}

.progress {
  width: min(78vw, 41rem);
  height: 0.34rem;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
}

.progress__fill {
  width: 100%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--orange), var(--teal-bright));
  box-shadow: 0 0 1rem rgba(75, 214, 200, 0.35);
  transform-origin: left center;
  transition: transform 200ms linear;
}

.time-note {
  min-height: 1.5rem;
  margin: 0.8rem 0 0;
  color: var(--muted);
  font-size: 0.93rem;
  letter-spacing: 0.04em;
}

.primary-controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.8rem;
  margin-top: clamp(1.7rem, 4vh, 2.8rem);
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  min-height: 3.35rem;
  padding: 0.8rem 1.25rem;
  border: 1px solid transparent;
  border-radius: 0.9rem;
  color: var(--ink);
  font-size: 0.95rem;
  font-weight: 720;
  cursor: pointer;
  transition: transform 180ms var(--ease), box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
}

.button:hover {
  transform: translateY(-2px);
}

.button:active {
  transform: translateY(0);
}

.button--primary {
  min-width: 8.7rem;
  color: #062029;
  background: linear-gradient(135deg, #63ded1, #2cb8b0);
  box-shadow: 0 0.8rem 2.2rem rgba(31, 183, 173, 0.18);
}

.button--primary:hover {
  box-shadow: 0 1rem 2.7rem rgba(31, 183, 173, 0.3);
}

.button--secondary {
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.08);
}

.button--secondary:hover,
.button--ghost:hover {
  border-color: rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.12);
}

.button--ghost {
  border-color: transparent;
  background: transparent;
}

.footer-note {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.8rem;
  color: rgba(204, 223, 227, 0.55);
  font-size: 0.77rem;
  letter-spacing: 0.04em;
}

.footer-note__mark {
  width: 0.25rem;
  height: 0.25rem;
  border-radius: 50%;
  background: var(--orange);
}

.time-dialog {
  width: min(calc(100% - 2rem), 37rem);
  max-width: none;
  padding: 0;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 1.5rem;
  color: var(--ink);
  background: #092934;
  box-shadow: 0 2.4rem 7rem rgba(0, 0, 0, 0.55);
}

.time-dialog::backdrop {
  background: rgba(1, 12, 17, 0.74);
  backdrop-filter: blur(10px);
}

.time-dialog[open] {
  animation: dialog-in 280ms var(--ease);
}

.time-dialog__surface {
  padding: clamp(1.25rem, 4vw, 2rem);
}

.dialog-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
}

.eyebrow {
  margin: 0 0 0.4rem;
  color: var(--teal-bright);
  font-size: 0.72rem;
  font-weight: 760;
  letter-spacing: 0.17em;
  text-transform: uppercase;
}

.dialog-heading h2 {
  margin: 0;
  font-size: clamp(1.6rem, 4vw, 2rem);
  letter-spacing: -0.03em;
}

.icon-button {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 2.75rem;
  height: 2.75rem;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: inherit;
  background: rgba(255, 255, 255, 0.06);
  cursor: pointer;
}

.icon-button:hover {
  background: rgba(255, 255, 255, 0.12);
}

.quick-set,
.manual-time {
  padding: 0;
  margin: 1.6rem 0 0;
  border: 0;
}

.quick-set legend,
.manual-time legend {
  margin-bottom: 0.75rem;
  color: #b8cbd0;
  font-size: 0.82rem;
  font-weight: 700;
}

.preset-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.55rem;
}

.preset {
  min-height: 2.9rem;
  border: 1px solid var(--line);
  border-radius: 0.75rem;
  color: #c5d7da;
  background: rgba(255, 255, 255, 0.055);
  font-weight: 700;
  cursor: pointer;
  transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
}

.preset:hover {
  border-color: rgba(75, 214, 200, 0.5);
}

.preset.is-selected {
  border-color: rgba(75, 214, 200, 0.75);
  color: #061d27;
  background: var(--teal-bright);
}

.time-fields {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1fr;
  align-items: end;
  gap: 0.55rem;
}

.time-fields label {
  display: grid;
  gap: 0.5rem;
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 700;
}

.time-fields input {
  width: 100%;
  height: 4rem;
  border: 1px solid var(--line);
  border-radius: 0.8rem;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.055);
  font-size: 1.65rem;
  font-variant-numeric: tabular-nums;
  font-weight: 720;
  text-align: center;
}

.time-fields input:focus {
  border-color: var(--teal-bright);
}

.field-separator {
  padding-bottom: 1.1rem;
  color: rgba(255, 255, 255, 0.3);
  font-size: 1.3rem;
}

.form-error {
  min-height: 1.2rem;
  margin: 0.55rem 0 0;
  color: #ffbd8c;
  font-size: 0.8rem;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.7rem;
  padding-top: 0.45rem;
}

.alarm-banner {
  position: fixed;
  right: 1rem;
  bottom: max(1rem, env(safe-area-inset-bottom));
  z-index: 10;
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 0.8rem;
  width: min(calc(100% - 2rem), 31rem);
  padding: 0.85rem;
  border: 1px solid rgba(255, 173, 102, 0.28);
  border-radius: 1rem;
  color: var(--ink);
  background: rgba(8, 36, 45, 0.96);
  box-shadow: 0 1.4rem 4rem rgba(0, 0, 0, 0.42);
  backdrop-filter: blur(16px);
  animation: banner-in 320ms var(--ease);
}

.alarm-banner strong,
.alarm-banner span {
  display: block;
}

.alarm-banner strong {
  font-size: 0.94rem;
}

.alarm-banner span {
  margin-top: 0.16rem;
  color: var(--muted);
  font-size: 0.78rem;
}

.alarm-banner__pulse {
  width: 0.7rem;
  height: 0.7rem;
  margin-left: 0.2rem;
  border-radius: 50%;
  background: var(--orange-bright);
  box-shadow: 0 0 0 0.38rem rgba(255, 173, 102, 0.13);
}

.alarm-banner__action {
  min-height: 2.35rem;
  padding: 0.5rem 0.75rem;
  border: 1px solid rgba(255, 173, 102, 0.35);
  border-radius: 0.65rem;
  color: #ffe3ce;
  background: rgba(245, 138, 58, 0.13);
  font-size: 0.76rem;
  font-weight: 740;
  cursor: pointer;
}

.icon-button--small {
  width: 2.25rem;
  height: 2.25rem;
}

.icon-button--small .icon {
  width: 1rem;
  height: 1rem;
}

@keyframes breathe {
  0%, 100% { transform: scale(0.92); }
  50% { transform: scale(1.08); }
}

@keyframes finish-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.018); }
}

@keyframes final-minute-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.42; }
}

@keyframes dialog-in {
  from { opacity: 0; transform: translateY(1.5rem) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes banner-in {
  from { opacity: 0; transform: translateY(1rem); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 700px) {
  .app-shell {
    padding-inline: 1rem;
  }

  .brand__plate {
    min-width: 12.25rem;
    min-height: 4.4rem;
  }

  .brand__logo {
    width: 12.25rem;
    max-height: 4rem;
  }

  .sound-control {
    min-height: 2.65rem;
  }

  .sound-control span {
    display: none;
  }

  .timer-display {
    font-size: clamp(6rem, 30vw, 11.1rem);
  }

  .timer-display.has-hours {
    font-size: clamp(4rem, 16vw, 7.5rem);
  }

  .primary-controls {
    width: 100%;
  }

  .button--primary {
    flex: 1 1 100%;
  }

  .primary-controls .button--secondary,
  .primary-controls .button--ghost {
    flex: 1 1 calc(50% - 0.4rem);
  }

  .footer-note {
    text-align: center;
  }

  .footer-note span:last-child,
  .footer-note__mark {
    display: none;
  }

  .alarm-banner {
    right: 1rem;
    grid-template-columns: auto 1fr auto;
  }

  .alarm-banner__action {
    grid-column: 2;
    justify-self: start;
  }
}

@media (max-height: 720px) and (min-width: 701px) {
  .timer-workspace {
    padding-block: 1.4rem;
  }

  .timer-wrap {
    margin-block: 1.5rem;
  }

  .timer-display {
    font-size: min(30vh, 16.5rem);
  }

  .timer-display.has-hours {
    font-size: min(22vh, 12rem);
  }

  .primary-controls {
    margin-top: 1.5rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

    </style>


  </head>
  <body>
    <div class="ambient ambient--orange" aria-hidden="true"></div>
    <div class="ambient ambient--teal" aria-hidden="true"></div>

    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="https://mmc.port.mv/" target="_blank" rel="noreferrer" aria-label="Maldives Maritime Conference website">
          <span class="brand__plate">

        <button class="sound-control" id="soundToggle" type="button" aria-pressed="true" aria-label="Mute timer sounds">
          <svg class="icon icon--sound" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6.8 8.5H3.5v7h3.3L11 19V5Z"></path>
            <path class="sound-wave" d="M15 8.5a5 5 0 0 1 0 7"></path>
            <path class="sound-wave" d="M18 5.5a9 9 0 0 1 0 13"></path>
          </svg>
          <span id="soundLabel">Sound on</span>
        </button>
      </header>

      <main class="timer-workspace">
        <section class="timer-panel" aria-labelledby="timerHeading">
          <h1 class="sr-only" id="timerHeading">Countdown timer</h1>

          <div class="status-line" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText">Ready</span>
          </div>

          <div class="timer-wrap">
            <div class="timer-display" id="timerDisplay" role="timer" aria-label="15 minutes remaining">
              <span id="hoursGroup" hidden><span id="hours">00</span><span class="separator">:</span></span><span id="minutes">15</span><span class="separator">:</span><span id="seconds">00</span>
            </div>
          </div>

          <div class="progress" aria-hidden="true">
            <div class="progress__fill" id="progressFill"></div>
          </div>

          <p class="time-note" id="timeNote">15 minute session</p>

          <div class="primary-controls">
            <button class="button button--primary" id="startPauseButton" type="button">
              <svg class="icon play-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 5 11 7-11 7V5Z"></path>
              </svg>
              <svg class="icon pause-icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <path d="M7 5h4v14H7zM14 5h4v14h-4z"></path>
              </svg>
              <span id="startPauseLabel">Start</span>
            </button>

            <button class="button button--secondary" id="resetButton" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4.9 8.2A8 8 0 1 1 4 14"></path>
                <path d="M4 4v5h5"></path>
              </svg>
              Reset
            </button>

            <button class="button button--ghost" id="adjustButton" type="button" aria-haspopup="dialog">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path>
                <circle cx="16" cy="7" r="2"></circle>
                <circle cx="8" cy="17" r="2"></circle>
              </svg>
              Set time
            </button>
          </div>
        </section>
      </main>

      <footer class="footer-note">
        <span>Soft reminders sound at 05:00 and 01:00</span>
        <span class="footer-note__mark" aria-hidden="true"></span>
        <span>Space to start or pause</span>
      </footer>
    </div>

    <dialog class="time-dialog" id="timeDialog" aria-labelledby="dialogTitle">
      <form class="time-dialog__surface" id="timeForm" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">Timer control</p>
            <h2 id="dialogTitle">Set duration</h2>
          </div>
          <button class="icon-button" id="closeDialog" type="button" aria-label="Close time controls">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18"></path>
            </svg>
          </button>
        </div>

        <fieldset class="quick-set">
          <legend>Quick set</legend>
          <div class="preset-grid">
            <button class="preset" type="button" data-minutes="5">5 min</button>
            <button class="preset" type="button" data-minutes="10">10 min</button>
            <button class="preset is-selected" type="button" data-minutes="15">15 min</button>
            <button class="preset" type="button" data-minutes="30">30 min</button>
            <button class="preset" type="button" data-minutes="45">45 min</button>
            <button class="preset" type="button" data-minutes="60">60 min</button>
          </div>
        </fieldset>

        <fieldset class="manual-time">
          <legend>Custom time</legend>
          <div class="time-fields">
            <label>
              <span>Hours</span>
              <input id="hoursInput" name="hours" type="number" inputmode="numeric" min="0" max="99" value="0" />
            </label>
            <span class="field-separator" aria-hidden="true">:</span>
            <label>
              <span>Minutes</span>
              <input id="minutesInput" name="minutes" type="number" inputmode="numeric" min="0" max="59" value="15" />
            </label>
            <span class="field-separator" aria-hidden="true">:</span>
            <label>
              <span>Seconds</span>
              <input id="secondsInput" name="seconds" type="number" inputmode="numeric" min="0" max="59" value="0" />
            </label>
          </div>
          <p class="form-error" id="formError" role="alert"></p>
        </fieldset>

        <div class="dialog-actions">
          <button class="button button--secondary" id="cancelButton" type="button">Cancel</button>
          <button class="button button--primary" id="applyButton" type="submit">Apply time</button>
        </div>
      </form>
    </dialog>

    <div class="alarm-banner" id="alarmBanner" role="status" aria-live="assertive" hidden>
      <div class="alarm-banner__pulse" aria-hidden="true"></div>

  const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
  const pad = (value) => String(value).padStart(2, "0");

  function formatDuration(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / SECOND));
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    return { totalSeconds, hours, minutes, seconds };
  }

  function describeDuration(ms) {
    const totalSeconds = Math.round(ms / SECOND);
    if (totalSeconds % 3600 === 0) {
      const hours = totalSeconds / 3600;
      return `${hours} hour${hours === 1 ? "" : "s"} set`;
    }
    if (totalSeconds % 60 === 0) {
      const minutes = totalSeconds / 60;
      return `${minutes} minute${minutes === 1 ? "" : "s"} set`;
    }
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    if (!minutes) return `${seconds} second${seconds === 1 ? "" : "s"} set`;
    return `${minutes}m ${seconds}s set`;
  }

  function render() {
    const time = formatDuration(remainingMs);
    const showHours = time.hours > 0 || durationMs >= 3600 * SECOND;

    elements.hoursGroup.hidden = !showHours;
    elements.display.classList.toggle("has-hours", showHours);
    elements.hours.textContent = pad(time.hours);
    elements.minutes.textContent = pad(time.minutes);
    elements.seconds.textContent = pad(time.seconds);

    const spoken = [
      time.hours ? `${time.hours} hour${time.hours === 1 ? "" : "s"}` : "",
      `${time.minutes} minute${time.minutes === 1 ? "" : "s"}`,
      `${time.seconds} second${time.seconds === 1 ? "" : "s"}`

    const progress = durationMs > 0 ? clamp(remainingMs / durationMs, 0, 1) : 0;
    elements.progressFill.style.transform = `scaleX(${progress})`;

    const warning = running && remainingMs > 0 && remainingMs <= FIVE_MINUTES;
    const finalMinute = running && remainingMs > 0 && remainingMs <= ONE_MINUTE;
    elements.body.classList.toggle("is-running", running);
    elements.body.classList.toggle("is-warning", warning);
    elements.body.classList.toggle("is-final-minute", finalMinute);

    if (running) {
      elements.statusText.textContent = finalMinute ? "Final minute" : warning ? "Final five minutes" : "Counting down";
      elements.timeNote.textContent = finalMinute ? "One-minute remaining" : warning ? "Five-minutes remaining" : "Timer is running";
    } else if (remainingMs === 0) {
      elements.statusText.textContent = "Time's up";
      elements.timeNote.textContent = "Session complete";
    } else if (remainingMs < durationMs) {
      elements.statusText.textContent = "Paused";

      elements.timeNote.textContent = describeDuration(durationMs).replace(" set", " session");

    elements.startPauseLabel.textContent = running ? "Pause" : remainingMs === 0 ? "Start again" : "Start";

      ? `${pad(time.hours)}:${pad(time.minutes)}:${pad(time.seconds)}`
      : `${pad(time.minutes)}:${pad(time.seconds)}`;

    const previous = remainingMs;

    if (!soundEnabled) return false;

        audio.muted = true;
        return audio.play()
          .then(() => true)
          .catch(() => false)
          .finally(() => {
            audio.pause();
            audio.currentTime = 0;
            audio.muted = false;
            audio.volume = previousVolume;

    }
  }

  async function playAlarmSound(kind) {
    await ensureAudio();
    const audio = alarmAudios[kind];
    if (!audio || !soundEnabled) return;
    audio.pause();
    audio.currentTime = 0;
    audio.muted = false;
    audio.volume = kind === "finish" ? 0.92 : 0.88;
    try {
      await audio.play();
    } catch (_) {
      // Browser audio policies can require another direct interaction.
    }
  }

  async function playFiveMinuteReminder() {
    stopActiveAlarm();
    await playAlarmSound("fiveMinute");
  }

  async function playOneMinuteReminder() {
    stopActiveAlarm();
    await playAlarmSound("oneMinute");
  }

  async function playFinalAlarm() {
    stopActiveAlarm();
    await playAlarmSound("finish");
  }

  function stopActiveAlarm() {
    Object.values(alarmAudios).forEach((audio) => {
      audio.pause();
      audio.currentTime = 0;
    });
  }

  function showBanner(title, message, showStop, timeout = 0) {
    window.clearTimeout(bannerTimeout);
    elements.alarmTitle.textContent = title;
    elements.alarmMessage.textContent = message;
    elements.stopAlarm.hidden = !showStop;
    elements.banner.hidden = false;
    if (timeout) {
      bannerTimeout = window.setTimeout(() => {
        elements.banner.hidden = true;
      }, timeout);
    }
  }

  function startTimer() {
    if (remainingMs <= 0) {
      remainingMs = durationMs;
      fiveMinuteReminderPlayed = false;
      oneMinuteReminderPlayed = false;
      elements.body.classList.remove("is-finished");
    }

    ensureAudio();
    running = true;
    endAt = Date.now() + remainingMs;

    if (durationMs === FIVE_MINUTES && remainingMs === FIVE_MINUTES && !fiveMinuteReminderPlayed) {
      fiveMinuteReminderPlayed = true;
      playFiveMinuteReminder();
      showBanner("Five minutes remaining", "Your five-minute session has started.", false, 6000);
    }

    if (durationMs === ONE_MINUTE && remainingMs === ONE_MINUTE && !oneMinuteReminderPlayed) {
      oneMinuteReminderPlayed = true;
      playOneMinuteReminder();
      showBanner("One minute remaining", "Your final minute has started.", false, 6000);
    }

    window.clearInterval(tickHandle);
    tickHandle = window.setInterval(syncRemaining, 100);
    render();
  }

  function pauseTimer() {
    if (!running) return;
    remainingMs = Math.max(0, endAt - Date.now());
    running = false;
    window.clearInterval(tickHandle);
    tickHandle = null;
    render();
  }

  function finishTimer() {
    running = false;
    remainingMs = 0;
    window.clearInterval(tickHandle);
    tickHandle = null;
    elements.body.classList.remove("is-running", "is-warning", "is-final-minute");
    elements.body.classList.add("is-finished");
    playFinalAlarm();
    showBanner("Time's up", "The countdown has finished.", soundEnabled, 0);
    render();
  }

  function resetTimer() {
    running = false;
    window.clearInterval(tickHandle);
    tickHandle = null;
    stopActiveAlarm();
    remainingMs = durationMs;
    fiveMinuteReminderPlayed = false;
    oneMinuteReminderPlayed = false;
    elements.body.classList.remove("is-running", "is-warning", "is-final-minute", "is-finished");
    elements.banner.hidden = true;
    render();
  }

  function toggleStartPause() {
    if (running) pauseTimer();
    else startTimer();
  }

  function populateInputs() {
    const totalSeconds = Math.round(durationMs / SECOND);
    elements.hoursInput.value = Math.floor(totalSeconds / 3600);
    elements.minutesInput.value = Math.floor((totalSeconds % 3600) / 60);
    elements.secondsInput.value = totalSeconds % 60;
    elements.formError.textContent = "";
    updatePresetSelection(totalSeconds / 60);
  }

  function updatePresetSelection(minutes) {
    elements.presets.forEach((button) => {
      button.classList.toggle("is-selected", Number(button.dataset.minutes) === Number(minutes));
    });
  }

  function openTimeDialog() {
    populateInputs();
    elements.dialog.showModal();
  }

  function closeTimeDialog() {
    elements.dialog.close();
  }

  function readNumber(input, max) {
    const parsed = Number.parseInt(input.value, 10);
    return Number.isFinite(parsed) ? clamp(parsed, 0, max) : 0;
  }

  function applyTime(event) {
    event.preventDefault();
    const hours = readNumber(elements.hoursInput, 99);
    const minutes = readNumber(elements.minutesInput, 59);
    const seconds = readNumber(elements.secondsInput, 59);
    const totalMs = (hours * 3600 + minutes * 60 + seconds) * SECOND;

    if (totalMs <= 0) {
      elements.formError.textContent = "Enter a duration longer than zero.";
      elements.minutesInput.focus();
      return;
    }

    durationMs = totalMs;
    remainingMs = totalMs;
    running = false;
    fiveMinuteReminderPlayed = false;
    oneMinuteReminderPlayed = false;
    window.clearInterval(tickHandle);
    tickHandle = null;
    stopActiveAlarm();
    elements.body.classList.remove("is-running", "is-warning", "is-final-minute", "is-finished");
    elements.banner.hidden = true;
    closeTimeDialog();
    render();
  }

  elements.startPause.addEventListener("click", toggleStartPause);
  elements.reset.addEventListener("click", resetTimer);
  elements.adjust.addEventListener("click", openTimeDialog);
  elements.closeDialog.addEventListener("click", closeTimeDialog);
  elements.cancel.addEventListener("click", closeTimeDialog);
  elements.timeForm.addEventListener("submit", applyTime);

  elements.presets.forEach((button) => {
    button.addEventListener("click", () => {
      const minutes = Number(button.dataset.minutes);
      elements.hoursInput.value = Math.floor(minutes / 60);
      elements.minutesInput.value = minutes % 60;
      elements.secondsInput.value = 0;
      elements.formError.textContent = "";
      updatePresetSelection(minutes);
    });
  });

  [elements.hoursInput, elements.minutesInput, elements.secondsInput].forEach((input) => {
    input.addEventListener("input", () => updatePresetSelection(-1));
  });

  elements.soundToggle.addEventListener("click", async () => {
    soundEnabled = !soundEnabled;
    elements.soundToggle.setAttribute("aria-pressed", String(soundEnabled));
    elements.soundToggle.setAttribute("aria-label", soundEnabled ? "Mute timer sounds" : "Turn timer sounds on");
    elements.soundLabel.textContent = soundEnabled ? "Sound on" : "Sound off";
    if (!soundEnabled) {
      stopActiveAlarm();
      elements.stopAlarm.hidden = true;
    } else {
      await ensureAudio();
    }
  });

  elements.stopAlarm.addEventListener("click", () => {
    stopActiveAlarm();
    elements.stopAlarm.hidden = true;
    elements.alarmMessage.textContent = "The countdown has finished. Alarm stopped.";
  });

  elements.dismissBanner.addEventListener("click", () => {
    elements.banner.hidden = true;
  });

  elements.dialog.addEventListener("click", (event) => {
    if (event.target === elements.dialog) closeTimeDialog();
  });

  document.addEventListener("keydown", (event) => {
    const target = event.target;
    const isFormControl = target instanceof HTMLInputElement || target instanceof HTMLButtonElement;
    if (event.code === "Space" && !isFormControl && !elements.dialog.open) {
      event.preventDefault();
      toggleStartPause();
    }
    if (event.key.toLowerCase() === "r" && !isFormControl && !elements.dialog.open) resetTimer();
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && running) syncRemaining();
  });

  window.addEventListener("beforeunload", stopActiveAlarm);
  render();
})();

    </script>
  </body>
</html>
